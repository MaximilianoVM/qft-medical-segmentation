name: Reporte PDF

on:
  push:
    branches: [ master, main, develop ]
    paths: [ 'paper/**', 'Makefile', '.github/workflows/reporte-pdf.yml' ]
  pull_request:
    branches: [ master, main ]
    paths: [ 'paper/**', 'Makefile', '.github/workflows/reporte-pdf.yml' ]
  workflow_dispatch:

jobs:
  reporte:
    runs-on: ubuntu-latest
    name: Reporte (sin plantilla JOSS)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Reporte PDF
        run: make reporte_pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reporte
          path: paper/reporte.pdf
