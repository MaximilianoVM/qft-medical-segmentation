services:
  develop:
    build: .
    image: qft_medical_segmentation:latest
    command: bash
    volumes:
      - .:/workdir

  demo:
    build: .
    image: qft_medical_segmentation_demo:latest
    command: jupyter lab --ip=0.0.0.0 --port=8888 --allow-root --NotebookApp.token=''
    ports:
      - "8080:8888"
      - "8501:8501"
    volumes:
      - .:/workdir